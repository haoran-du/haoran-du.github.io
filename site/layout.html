<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="theme-color" content="#f8f6f2">
  <script src="{{asset.theme}}"></script>
  <link rel="canonical" href="{{page.canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{site.url}}/assets/images/profile-placeholder.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{asset.stylesheet}}">
  <script src="{{asset.script}}" defer></script>
</head>
<body data-page="{{page.id}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container masthead">
      <a class="brand" href="index.html">{{site.name}}<span>{{site.tagline}}</span></a>
      <div class="theme-switch" hidden>
        <label for="theme-mode">Theme</label>
        <select id="theme-mode" aria-describedby="theme-help">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <span id="theme-help" class="visually-hidden">Auto uses your local time: light from 7 am to 7 pm, dark overnight.</span>
      </div>
    </div>
    <div class="navigation-wrap">
      <div class="container navigation-inner">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" hidden>Menu <span aria-hidden="true">☰</span></button>
        <nav class="site-nav" id="primary-nav" aria-label="Main navigation">{{navigation}}</nav>
        <a class="nav-cv" href="{{site.cv}}" aria-label="CV (PDF)">CV <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">{{content}}</main>
  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© <span id="year">2026</span> {{site.name}}</p>
      <a class="footer-qr" href="assets/images/qr-code.png" aria-label="Open full-size QR code for Haoran Du’s website">
        <img src="assets/images/qr-code.png" width="60" height="60" alt="QR code for Haoran Du’s website" loading="lazy">
      </a>
    </div>
  </footer>
</body>
</html>
