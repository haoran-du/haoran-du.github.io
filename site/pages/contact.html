<div class="container page-heading"><h1>Contact</h1></div>
<div class="container contact-layout">
  <section aria-labelledby="contact-heading">
    <h2 id="contact-heading" class="eyebrow">Email &amp; office</h2>
    <a class="email-link" href="mailto:{{site.email}}">{{site.email}} <span aria-hidden="true">↗</span></a>
    <address><strong>{{site.name}}</strong><br>{{site.affiliation}}<br>{{site.office}}, {{site.institution}}<br>{{site.location}}</address>
  </section>
  <section class="profiles-section" aria-labelledby="profiles-heading">
    <h2 id="profiles-heading" class="eyebrow">Academic profiles</h2>
    <a class="profile-link" href="{{site.scholar}}">Google Scholar <span aria-hidden="true">↗</span></a>
    <a class="profile-link" href="{{site.researchgate}}">ResearchGate <span aria-hidden="true">↗</span></a>
    <a class="profile-link" href="{{site.github}}">GitHub <span aria-hidden="true">↗</span></a>
  </section>
</div>
